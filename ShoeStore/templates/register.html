{% extends "base.html" %}
{% block content %}
<h2>Регистрация</h2>
<form method="post">
    <label>Email:</label>
    <input type="email" name="email" required><br>

    <label>Парола:</label>
    <input type="password" name="password" required><br>

    <label>Роля:</label><br>
    <input type="radio" name="role" value="client" checked> Клиент<br>
    <input type="radio" name="role" value="admin"> Администратор<br><br>

    <button type="submit">Регистрация</button>
</form>
{% endblock %}
